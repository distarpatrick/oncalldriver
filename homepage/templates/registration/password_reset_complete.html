{% extends "homepage/base.html" %}

{% block title %}Password Updated | {{ site_name }}{% endblock %}

{% block content %}
<div style="max-width:760px;margin:110px auto 40px;padding:0 20px;">
  <div style="background:linear-gradient(180deg,#fffef9 0%,#f3faf7 100%);border:1px solid #d8e4dc;border-radius:28px;padding:42px;box-shadow:0 24px 60px rgba(28,56,62,.12);">
    <div style="font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#1f8a74;font-family:'DM Mono',monospace;margin-bottom:12px;">All Set</div>
    <h1 style="margin:0 0 12px;font-size:2.3rem;color:#173042;">Password reset complete</h1>
    <p style="margin:0 0 22px;color:#607482;line-height:1.75;">Your password has been updated successfully. You can sign in with the new password now.</p>
    <a href="{% url 'homepage:auth' %}" style="display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:14px;background:linear-gradient(135deg,#1f8a74,#2a6f97);color:#fff;text-decoration:none;font-weight:700;">Go to sign in</a>
  </div>
</div>
{% endblock %}
